name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the shipped example still passes the self-check
        run: python scripts/check_profile_readme.py examples/README.data-narrative.example.md --username ada

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the shipped example spec
        run: |
          mkdir -p build
          python scripts/render_profile_readme.py --spec assets/profile.example.json --out build/README.md

      - name: The rendered output must pass the self-check
        run: python scripts/check_profile_readme.py build/README.md --username ada
