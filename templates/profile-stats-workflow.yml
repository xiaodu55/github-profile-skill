# 自托管统计卡：每天生成浅色/深色两版 SVG 并提交到 output/
#
# 用法：
# 1. 把本文件放到 <user>/<user>/.github/workflows/profile-stats.yml
# 2. 在仓库放 scripts/update_stats.py，负责把统计结果写成 output/stats-light.svg、
#    output/stats-dark.svg、output/collaboration-light.svg、output/collaboration-dark.svg
# 3. README 用 <picture> 引用这四个文件（深浅双主题）
#
# 为什么不用公共实例：公共实例限流后会 502，主页会出现裂图；自托管后失效面收敛在自己身上。

name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade requests

      - name: Generate SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_stats.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "chore: update profile stats"
          git push
